name: Documentation and Storybook Pages

# GitHub Pages must use Source: GitHub Actions (not "Deploy from a branch").
# Deploys on releases (tags) and can be manually triggered.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: documentation-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run analyze
      
      # Build documentation site
      - run: npm run documentation:build
      
      # Build Storybook
      - run: npm run build-storybook
      
      # Combine both into a single deployment
      # Documentation at root, Storybook under /storybook/
      - run: |
          mkdir -p pages-deploy
          cp -r documentation-static-check/* pages-deploy/
          mkdir -p pages-deploy/storybook
          cp -r storybook-static/* pages-deploy/storybook/
          touch pages-deploy/.nojekyll
      
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-deploy

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require GitHub Actions Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)"
          if [ "$type" != "workflow" ]; then
            echo "GitHub Pages source is '${type}', not 'workflow'."
            echo "Set Settings → Pages → Source to GitHub Actions."
            echo "Branch deploy from main publishes README.md via Jekyll instead of documentation."
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@v4

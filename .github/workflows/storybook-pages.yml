name: Documentation and Storybook Pages

# GitHub Pages must use Source: GitHub Actions (not "Deploy from a branch").
# Deploys on releases (tags) and can be manually triggered.
# Also runs as a build-only dry run on PRs that touch the workflow or docs config.

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/storybook-pages.yml"
      - "documentation/**"
      - ".storybook/**"
      - "stories/**"
      - "templates/admin/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: documentation-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run analyze

      # Build documentation site
      - run: npm run documentation:build

      # Build Storybook
      - run: npm run build-storybook

      # Rowan Admin starter, published at /rowan/admin/
      - run: npm run build --workspace=@rowan-ui/admin-template

      # Combine both into a single deployment
      # Documentation at root, Storybook under /storybook/, admin under /admin/
      - name: Assemble Pages deployment
        run: |
          # Verify build outputs exist
          if [ ! -d "documentation/documentation-static-check" ]; then
            echo "❌ Documentation build output not found at documentation/documentation-static-check/"
            echo "Expected: documentation/documentation-static-check/index.html"
            ls -la documentation/ || true
            exit 1
          fi

          if [ ! -d "storybook-static" ]; then
            echo "❌ Storybook build output not found at storybook-static/"
            echo "Expected: storybook-static/index.html"
            ls -la . | grep storybook || true
            exit 1
          fi

          # Assemble combined deployment
          mkdir -p pages-deploy
          cp -r documentation/documentation-static-check/* pages-deploy/
          mkdir -p pages-deploy/storybook
          cp -r storybook-static/* pages-deploy/storybook/
          if [ ! -f templates/admin/dist/index.html ]; then
            echo "❌ Admin template build output not found at templates/admin/dist/index.html"
            exit 1
          fi
          mkdir -p pages-deploy/admin
          cp -r templates/admin/dist/* pages-deploy/admin/
          touch pages-deploy/.nojekyll

          # Verify assembly
          echo "✓ Pages deployment assembled:"
          echo "  - Documentation: pages-deploy/index.html"
          ls -lh pages-deploy/index.html
          echo "  - Storybook: pages-deploy/storybook/index.html"
          ls -lh pages-deploy/storybook/index.html
          echo "  - Admin: pages-deploy/admin/index.html"
          ls -lh pages-deploy/admin/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-deploy

  deploy:
    name: Deploy
    # Only deploy on release or manual workflow_dispatch, not on pull requests
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require GitHub Actions Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)"
          if [ "$type" != "workflow" ]; then
            echo "GitHub Pages source is '${type}', not 'workflow'."
            echo "Set Settings → Pages → Source to GitHub Actions."
            echo "Branch deploy from main publishes README.md via Jekyll instead of documentation."
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@v4

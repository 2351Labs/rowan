name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run types
      - run: npm run typecheck
      - run: npm run analyze
      - run: npm run lint --workspace=@rowan-ui/icons
      - run: npm run verify --workspace=@rowan-ui/icons
      - run: npm run types --workspace=@rowan-ui/icons
      - run: npm run typecheck --workspace=@rowan-ui/icons
      - name: Verify CI parity
        run: node scripts/check-ci-parity.mjs
      - name: Verify generated artifacts
        run: |
          changes="$(git status --porcelain --untracked-files=all -- custom-elements.json types packages/icons/custom-elements.json packages/icons/types packages/maplibre/custom-elements.json packages/maplibre/types src/react/generated packages/icons/src/react/generated packages/maplibre/src/react/generated)"
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes"
            exit 1
          fi
      - run: npm test
      - name: Measure and enforce test coverage
        run: npm run coverage
      - run: npm run test:package
      - run: npm run size:check
      - run: npm run test --workspace=@rowan-ui/icons
      - run: npm run documentation:build
      - run: npm run build-storybook
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Storybook smoke test
        run: node test/storybook-smoke.spec.mjs
      - name: Build admin template
        run: npm run build --workspace=@rowan-ui/admin-template
      - name: Admin template smoke test
        run: node templates/admin/e2e/smoke.mjs
      - name: Verify documentation version consistency
        run: node scripts/check-docs-version.mjs
      - name: Verify API reference is current
        run: node scripts/generate-api-reference.mjs --check
      - name: Verify all components have API references
        run: node scripts/check-component-docs-coverage.mjs
      - name: Check Storybook story coverage
        run: npm run coverage:check
      - run: npm pack --dry-run
      - run: npm pack --dry-run --workspace=@rowan-ui/icons
      - run: npm pack --dry-run --workspace=@rowan-ui/maplibre

  browser-compatibility:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          ROWAN_BROWSER: ${{ matrix.browser }}
      - run: npm run test:browser --workspace=@rowan-ui/icons
        env:
          ROWAN_BROWSER: ${{ matrix.browser }}
